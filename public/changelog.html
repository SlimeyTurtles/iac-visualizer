<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog — Semantic Network Models</title>
    <link rel="stylesheet" href="/theme.css">
    <style>
        body {
            background: radial-gradient(ellipse at top, var(--bg-panel) 0%, var(--bg-app) 60%);
            min-height: 100vh;
            height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 24px 60px 24px;
            overflow: auto;
        }

        .header { text-align: center; max-width: 720px; margin-bottom: 48px; }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-strong);
            margin: 0 0 14px 0;
            letter-spacing: -0.02em;
        }
        .header p { font-size: 1rem; color: var(--text-muted); margin: 0; line-height: 1.6; }

        .timeline { max-width: 720px; width: 100%; position: relative; padding-left: 28px; }
        .timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: linear-gradient(to bottom, var(--accent), var(--border-mid));
        }

        .release {
            position: relative;
            background: var(--bg-panel);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-xl);
            padding: 20px 24px;
            margin-bottom: 24px;
        }
        .release::before {
            content: '';
            position: absolute;
            left: -27px;
            top: 26px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--bg-app);
            border: 3px solid var(--accent);
        }
        .release:first-child::before { background: var(--accent); box-shadow: 0 0 10px var(--accent-glow, rgba(245, 158, 11, 0.4)); }

        .release-head {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }
        .release-version {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent);
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        }
        .release-date { font-size: 0.8rem; color: var(--text-dim); }
        .release-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-strong);
            margin: 0 0 10px 0;
        }
        .release ul { margin: 0; padding-left: 20px; }
        .release li {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 4px;
        }
        .release li strong { color: var(--text-strong); font-weight: 600; }
        .release li code {
            font-size: 0.8rem;
            background: var(--bg-card);
            padding: 1px 5px;
            border-radius: var(--radius-sm);
            color: var(--text-strong);
        }

        .footer { margin-top: 40px; font-size: 0.75rem; color: var(--border-strong); text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <h1>Changelog</h1>
    <p>Everything that has happened to this site, newest first. Versions follow semver-ish rules: minor bumps for new pages/models/features, patch bumps for fixes and tweaks.</p>
</div>

<div class="timeline" id="timeline"></div>

<div class="footer">
    Use the menu in the top-right corner to navigate between models.
</div>

<script>
// Newest first. To add a release: prepend an object here.
// { version, date, title, changes: [ ...strings, may contain <strong>/<code> ] }
const CHANGELOG = [
    {
        version: '0.13.0',
        date: '2026-10-16',
        title: 'Action Graph — Hebbian credit on actions, not states',
        changes: [
            '<strong>Action Graph (Step-Indexed Hebbian)</strong>: every integer triple (A, B, C) is a node; every node branches through one shared action vocabulary — <code>X += Y</code>, <code>X −= Y</code>, <code>X ×D</code>, <code>X ÷D</code> (integer results only) and <code>X = 0</code> for each target variable X (27 actions at D ≤ 3). Illegal, out-of-domain and identity moves have no edge. IAC spreads symmetrically from the clamped current + goal states with decay and no competition.',
            '<strong>Learned weight lives on (step, action), not on the state pair</strong>: the edge’s slot is indexed by its source’s BFS depth from the clamped current state and the action taken, so <code>(8,4,2) → (12,4,2)</code> and <code>(3,1,2) → (4,1,2)</code> both train “step 1 is A += B”. Co-activation above a threshold θ is pooled per step row, converted to a share, grown by η and held under a per-row budget; a pooled per-action mode and a walked-plan-only credit mode are selectable for comparison, as is success gating.',
            '<strong>Readouts</strong>: greedy forward plan (most active unvisited neighbour), the widest activation bridge (max–min bottleneck route, drawn dashed), optimal hops via BFS, and a frozen evaluation over every task in the curriculum range broken down by optimal hop count. Curriculum: (A, B, C) → ((A + B) mod C, 0, 0), sampled with a seeded RNG, trained in chunked batches with a rolling success curve.',
            '<strong>Layered branching canvas</strong>: columns are steps from the current state, nodes are the active states in each layer (capped per column, sorted by activation), forward edges thicken with learned weight, the walked plan is labelled with its actions; click a node to make it the current state, shift-click to make it the goal, and scrub the settle history. Corner cards show the learned step × action heatmap (the “program”, with this episode’s walked cells outlined) and the training curve with evaluation dots.',
            '<strong>Goal-free test mode</strong>: a Test panel clamps only the start state and lets the learned (step, action) weights steer the spread alone; the test passes when the correct ((A + B) mod C, 0, 0) is the most active goal-shaped node (x, 0, 0). The canvas shows the route activation took to the lit goal (red when wrong) against the widest route to the correct goal (dashed green); “Test all tasks” scores the whole curriculum range with hollow dots on the training curve. Headless: 30/144 untrained, 39/144 after 600 episodes.',
            '<strong>Watching it happen</strong>: a play button animates any run through its settle steps; an “all states” toggle lays out the whole lattice (1183 states at the default bounds — it is finite, not exponential), wrapping wide layers into sub-columns; and the training card gains a “weights” tab tracing the strongest (step, action) slots across episodes (smoothed, since the row budget rescales each episode) plus an episode slider that rewinds the heatmap to any past snapshot.',
            '<strong>Competition per step</strong>: nodes at the same BFS depth from the start now inhibit one another (strength × the sum of the other activations in that layer; Network Bounds → “Step competition”, 0 = off). The clamped endpoints receive but never send it, so the goal cannot suppress its own feeder states. At 0.003 the active set drops from ~770 to ~74 nodes and learning still lifts both readouts (clamped 123 → 133, goal-free 24 → 31 on seed 2), but no competition strength found so far beats the uncompeted 141/144 ceiling — thinner activation gives the greedy walker less gradient.',
            '<strong>Pared-down UI</strong>: helper prose, the explainer, custom goals and the settle/step/watch buttons are gone. The goal-free Test is the main probe — clicking any node tests from it, a batch ends by re-testing your start, and “Learn episode” is the only single-episode action.',
            'Sidebar reorganised into Network Bounds → Hebbian Learning → Training (batch + single episode, modulo goal shown inline, shift-click override) → Test, with compact non-wrapping controls.',
            'Model in <code>public/action_graph_model.js</code> shared with <code>scripts/tune_action_graph.js</code>. Headless result at defaults (w₀ 0.003, θ 0.25, 600 episodes): frozen success over 144 tasks goes 133 → 139 / 141 / 134 on three seeds but 99 on a fourth that locked in an early C-zeroing step; efficiency rises 0.60 → 0.7–0.87 wherever success holds. Without θ the flooded net credits all actions nearly equally; path-only credit hardens fastest and locks in hardest.',
        ],
    },
    {
        version: '0.12.0',
        date: '2026-09-28',
        title: 'ART Addition — can hubs extrapolate to an untaught digit?',
        changes: [
            '<strong>ART Addition (Two-Number Hubs)</strong>: two localist digit pools (0–9, one-hot) feed an ART hub layer (vigilance recruitment, EWMA templates, per-pool normalized-Euclidean similarity). Each recruited hub wires its output to the correct sum node (0–20); recall blends hub votes with a softmax over similarity.',
            '<strong>Held-out digit experiment</strong>: train on all pairs except those containing an excluded digit (default 4), then probe them. The page shows the full network (input pools → hubs → sum nodes), the output activation profile over sums, and a clickable 10×10 evaluation grid with held-out rows/columns outlined.',
            'Runs entirely client-side — no Python bridge.',
            '<strong>Floating canvas layout</strong>: the network sits on a pan/zoom canvas (drag to move, scroll to zoom, Reset View button) like the other model pages; recall status, the output-activation bars, and the expandable all-pairs grid float as corner cards over it.',
            '<strong>ART Addition (Distributed)</strong>: same adder with Gaussian-bump digit codes (width σ is a hyperparameter) instead of one-hot — 4 overlaps 3 and 5, so nearby hubs vote for nearby sums and the output forms a hill around the true sum instead of a flat spread. Input nodes render the live activation profile.',
            'New <strong>ART Arithmetic</strong> section on the home page and nav menu grouping the localist and distributed adders; the two pages cross-link.',
            '<strong>ART Arithmetic (Add & Subtract)</strong>: third localist pool for the operator (two nodes, + and −); hubs recruit over the (A, op, B) triple and wire to result nodes −9…18. Trained on all 100 pairs × both operators; the all-pairs card gets per-operator tabs. The 2-unit operator pool is normalized by its own size, so flipping the operator zeroes that pool’s similarity — a small pool speaks as loudly as a whole digit pool.',
            '<strong>ART Modulo (Recurrent Subtraction)</strong>: the operator pool grows a <em>done</em> node and hubs learn state transitions — (Sub, A, B) → next step of modulo-by-repeated-subtraction, flagging done when the remainder drops below B. Recall feeds back into the input so the network runs the algorithm; a trajectory card shows each step (click a step to inspect its recall). Trained on every step for A 0–9, B ∈ {1, 2, 4, 5}; mod 3 held out. Result grid runs full trajectories per (A, B).',
            '<strong>Check operator</strong> on the modulo page: a fourth op node (?) that is a pure comparison — (check, A, B) → (sub, A, B) if A ≥ B, else (done, A, B). Check states are trained over the same domain (80 hubs total) and runs now enter through check; a start-op selector lets you probe from check or sub directly.',
            '<strong>Goal pool</strong> on the modulo page: a fourth pool (± arithmetic / % modulo) frames every state. Arithmetic goal trains all additions and in-range subtractions as one-shot computes whose next operator is <em>nothing</em> (an empty op pool, decoded as ∅ below threshold); modulo goal keeps the check/sub recurrence with mod 3 subs untrained. ~195 hubs; the tighter similarity gap needed gain 400.',
            '<strong>Compositional mod-3 solved — 10/10 with zero mod-3 subtraction training.</strong> Three pieces made it work: (1) recall matches on operands only — op hard-enforced, goal not matched (tiny −0.02 tie-break so trained states prefer same-goal twins) — letting the arithmetic hub (±, −, A, 3) win modulo probes; (2) arithmetic memories are pure facts with empty goal/op output pools; (3) silent pools defer to task context — the goal persists (intention, not memory) and an empty op pool falls back to the goal’s policy (% → check, ± → halt). 7 mod 3 now runs ? 7,3 → − 7,3 → ? 4,3 → − 4,3 → ? 1,3 → ✓ 1. Trained mods stay 40/40, arithmetic 105/105.',
            '<strong>Factored sub→check loop</strong>: sub no longer decides “done” itself — it only subtracts and always hands back to check, so trajectories alternate ? → − → ? until check terminates. Sub states are trained only where A ≥ B (the states a correct execution can reach), eliminating junk hubs like (−, 2, 5) that no real run ever visits.',
            '<strong>Hard operator matching</strong> on the modulo page (toggle, default on): hubs whose template carries a different operator are excluded from ART competition entirely — different actions never blend, at any gain. (B was briefly widened to 0–9 to test whether more moduli help mod 3: trained went 40→80 and arith 105→155 while mod 3 stayed exactly 3/10 with B=3 receiving zero votes in an 8-way tie — the wall is representational, not data scarcity. Reverted to 0–5.)',
            '<strong>Split readout — the wired fallback is gone (off by default)</strong>: operand pools read from the goal-free electorate (facts transfer across goals), the op pool reads only from same-goal memories (policies don’t). For (%, −, 9, 3) the arithmetic fact supplies A′=6 while the four other moduli’s sub hubs unanimously supply “check” — mod 3 stays 10/10, arithmetic still halts on its memories’ unanimous silence, and no behavioral rule is hard-coded. Hub tooltips show fact vs control activation; control votes draw their own links to the op node.',
            '<strong>Partial-cue probes + dashed carriers</strong>: clicking a pool’s active unit switches the whole pool off — recall then matches on whatever remains (masked pools, like sensory dropout), showing e.g. what the memory does with no operator cue at all; click any node in the dark pool to restore. And values that reach the NEXT row by persistence or goal policy (rather than memory votes) now render as dashed grey carrier lines, so every lit output node has a visible source.',
            '<strong>Clickable state row</strong> on the modulo page: clicking a unit edits only that pool’s value (goal, op, A, or B — the rest stay), syncs the test controls, reruns the trajectory, and shows the edited state’s recall. <strong>Shift-click</strong> opens the influence view instead: every hub whose template contains that unit, links onward to the outputs those hubs vote for, and a summary (hub count, next-op tally, next-A/B value sets) in the recall card. Also: the A-mod-B grid card is now no wider than its grid, and clicking a grid cell forces the test controls to modulo + check so it reruns exactly what the grid scored.',
            '<strong>Partial mod-3 curriculum toggle</strong>: train check on the skipped modulus while leaving its sub steps untrained (on by default). Mod 3 goes 0/10 → 3/10 — check handles every B=3 comparison correctly (A < 3 cases finish, B stays 3 through the routing), and failure isolates to exactly the untrained subtraction transitions.',
            '<strong>Population-vector readout</strong> on the distributed page (toggle vs argmax). Argmax is structurally stuck at off-by-one for the held-out digit — the two nearest hubs vote symmetrically around the true sum, never for it — at every σ/vigilance/gain. Decoding the distribution’s activation-weighted mean instead scores <strong>81/81 trained and 19/19 held-out</strong> at the new defaults (σ 1.6, gain 100, vigilance 0.995): perfect addition with a never-seen digit, from the same hubs.',
        ],
    },
    {
        version: '0.11.0',
        date: '2026-09-28',
        title: 'Arithmetic Pathfinding — Hebbian learning on the modulo task',
        changes: [
            '<strong>Arithmetic Pathfinding (Hebbian Lattice)</strong>: every integer triple (A, B, C) in a configurable domain is a state node; directed edges are the arithmetic moves <code>X &plusmn;= Y</code> (all ordered variable pairs) and <code>X = 0</code>, dropped when they would leave the domain. IAC spreads symmetrically from the clamped current + goal states and a greedy forward walker (dead-end aware) reads out the plan.',
            '<strong>Hebbian learning</strong>: after each settle, connected pairs potentiate in proportion to their co-activation, with a weight cap and <strong>homeostatic synaptic scaling</strong> — each node’s total incident weight is conserved, so strengthening one route depresses the node’s others. Learned weights travel as a sparse list between the page and the stateless bridge.',
            '<strong>Modulo curriculum</strong>: train batches of tasks (A,B,C) &rarr; ((A+B) mod C, 0, 0) and watch a rolling success/efficiency curve. Headless finding baked into the page docs: untrained success is distance-limited (~100% at &le;3 hops, ~0% at &ge;5); unconstrained Hebbian imprints a self-exciting attractor on the shared (x, 0, 0) goal axis and hurts; homeostasis + tight cap keeps it near-neutral.',
            'C-slice heatmap visualization with settle-history scrubber, found/optimal path overlays, learned-weight overlay, and click-to-set task states. Per-panel A/B axis ticks, and hovering any cell shows its exact (A, B, C) state, live activation, the full list of legal moves out of it, and highlights every connected neighbor across panels. New Python bridge <code>pathfind_arith.py</code> with <code>network</code>/<code>run</code>/<code>train</code> commands.',
            '<strong>Sibling-pool inhibition mode</strong>: each node’s out-neighbors (rival next-steps) mutually inhibit, collapsing the diffuse activation cloud into a sparse ridge (~25 active nodes vs ~160 under global inhibition). This makes co-activation Hebbian path-selective — the only regime found where learning pushes success above the frozen-weights reference.',
            '<strong>Clamp exemption for sibling inhibition</strong>: clamped endpoints no longer send pool inhibition. Without this the clamped goal suppressed its own feeder states (15 of its 16 neighbors were its pool rivals), cancelling the backward gradient it was simultaneously spreading.',
            '<strong>Inhibition “Off” mode</strong> for comparison. Measured on 0–5 starts: off = 0.66 success with all 726 nodes flooded (saturation ties blind the walker); global −0.001 = 0.87 with 158 active; sibling −0.05 = 0.68 with 34 active; sibling −0.02 = 0.78 with 100 active. Every mode is perfect at ≤2 hops and ~0% at 5 — the readout limit is gradient reach, not inhibition.',
            '<strong>Training start ranges</strong>: min/max bounds for sampled (A, B, C) start states (default 0–5), so early arithmetic like A += B stays inside the domain the way a human solver would keep it.',
        ],
    },
    {
        version: '0.10.0',
        date: '2026-09-08',
        title: 'MLP Pathfinding — layered state planner + bulk metrics',
        changes: [
            '<strong>MLP Pathfinding (Layered States)</strong>: MLP-shaped IAC network where each node is a world state and each random affordance-weighted edge is an action. Clamp the single bottom (current-state) node and a chosen top-layer goal; symmetric IAC dynamics meet in the middle and a greedy connected ascent reads out the plan. Shift-click lesioning, path overlays, shareable URLs.',
            '<strong>MLP Pathfinding (Bulk Metrics)</strong>: sweep hundreds of seeds server-side; per-seed outcomes (success / unreachable / dead end / wrong top), efficiency histogram, sortable + filterable table with click-through to any seed.',
            '<strong>Efficiency metric</strong>: found path’s mean affordance divided by the easiest possible path’s (exact Viterbi DP over the layered DAG) — a graded 0–1 success score instead of a binary hit/miss.',
            'New Python bridge <code>pathfind_mlp.py</code> with <code>network</code>/<code>run</code>/<code>sweep</code> commands.',
        ],
    },
    {

const timeline = document.getElementById('timeline');
CHANGELOG.forEach(rel => {
    const div = document.createElement('div');
    div.className = 'release';
    div.innerHTML = `
        <div class="release-head">
            <span class="release-version">v${rel.version}</span>
            <span class="release-date">${rel.date}</span>
        </div>
        <h3 class="release-title">${rel.title}</h3>
        <ul>${rel.changes.map(c => `<li>${c}</li>`).join('')}</ul>
    `;
    timeline.appendChild(div);
