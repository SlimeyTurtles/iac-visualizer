name: Deploy to home server

# Push to main → rsync into ~/iac on the box → rebuild + restart the web
# container. Runs on the self-hosted runner on the box itself, so no SSH
# or secrets are needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Sync source to ~/iac
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='notebooks/' \
            --exclude='archive/' \
            --exclude='__pycache__/' \
            "${{ github.workspace }}/" /home/avinh/iac/

      - name: Build + restart web
        working-directory: /home/avinh/iac
        run: docker compose up -d --build web

      - name: Smoke test
        working-directory: /home/avinh/iac
        run: |
          sleep 5
          docker compose ps web
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://localhost:3004/)
          echo "status: $code"
          [ "$code" = "200" ] && echo ok || { echo unexpected; exit 1; }
